      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: fer_hand
    constraints:
    - name: collision_1
      active: true
      constraint:
        class: ConstraintModelResidual
        lower: 0.1   # cm
        upper: inf
        residual:
          class: ResidualDistanceCollision2
          collision_pair: [fer_hand_sc_capsule_0, obstacle_0]
    - name: collision_2
      active: true
      constraint:
        class: ConstraintModelResidual
        lower: 0.1   # cm
        upper: inf
        residual:
          class: ResidualDistanceCollision2
          collision_pair: [fer_hand_sc_capsule_0, obstacle_1]
    - name: collision_3
      active: true
